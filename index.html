<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест: Куда тебе поехать в отпуск?</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      width: 90%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    .question {
      display: none;
      margin-top: 1rem;
    }
    .active {
      display: block;
    }
    button {
      background: #ffcc00;
      border: none;
      color: #000;
      font-size: 1rem;
      padding: 0.8rem 1.2rem;
      margin: 0.4rem 0;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    button:hover {
      background: #ffd633;
    }
    .loading {
      display: none;
      font-size: 1.2rem;
    }
    .result {
      display: none;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .dots {
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Куда тебе поехать в отпуск?</h1>

    <div id="q1" class="question active">
      <p>Что для тебя важнее всего в путешествии?</p>
      <button onclick="nextQuestion(1)">Море и солнце ☀️</button>
      <button onclick="nextQuestion(1)">Приключения 🌍</button>
      <button onclick="nextQuestion(1)">Еда и культура 🍜</button>
      <button onclick="nextQuestion(1)">Спокойствие и природа 🌲</button>
    </div>

    <div id="q2" class="question">
      <p>Сколько ты готов потратить на билет?</p>
      <button onclick="nextQuestion(2)">До 10 000 ₽</button>
      <button onclick="nextQuestion(2)">До 25 000 ₽</button>
      <button onclick="nextQuestion(2)">Неважно 💸</button>
    </div>

    <div id="q3" class="question">
      <p>Когда планируешь отпуск?</p>
      <button onclick="showLoading()">В ближайший месяц</button>
      <button onclick="showLoading()">Осенью 🍂</button>
      <button onclick="showLoading()">Зимой ❄️</button>
      <button onclick="showLoading()">Просто смотрю варианты 👀</button>
    </div>

    <div id="loading" class="loading">
      🔍 Подбираем лучшие направления<span class="dots">...</span>
    </div>

    <div id="result" class="result">
      <h2>🎉 Тебе подойдут путешествия по Европе и Азии!</h2>
      <p>Посмотри лучшие предложения прямо сейчас 👇</p>
      <a href="https://travel.yandex.ru/" target="_blank">
        <button>Посмотреть подборку</button>
      </a>
    </div>
  </div>

  <script>
    function nextQuestion(num) {
      document.getElementById(`q${num}`).classList.remove("active");
      document.getElementById(`q${num + 1}`).classList.add("active");
    }

    function showLoading() {
      document.getElementById("q3").classList.remove("active");
      document.getElementById("loading").style.display = "block";

      setTimeout(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("result").style.display = "block";
      }, 2000);
    }
  </script>
</body>
</html>
